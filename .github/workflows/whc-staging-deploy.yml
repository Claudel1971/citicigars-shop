name: WHC Vitrine - Contrôle en lecture seule

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lire:
    if: github.ref == 'refs/heads/codex/vitrine-retour-audit'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Vérifier la source du retour arrière sans écrire sur WHC
        env:
          WHC_HOST: ${{ vars.WHC_HOST }}
          WHC_PORT: ${{ vars.WHC_PORT }}
          WHC_USER: ${{ vars.WHC_USER }}
          WHC_KNOWN_HOSTS: ${{ vars.WHC_KNOWN_HOSTS }}
          WHC_SSH_KEY: ${{ secrets.WHC_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d "$RUNNER_TEMP/vitrine-retour.XXXXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s\n' "$WHC_SSH_KEY" > "$tmp/key"
          printf '%s\n' "$WHC_KNOWN_HOSTS" > "$tmp/known_hosts"
          auth=(-p "$WHC_PORT" -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$tmp/known_hosts")
          remote="$WHC_USER@$WHC_HOST"
          ssh "${auth[@]}" "$remote" 'uapi --output=json DomainInfo single_domain_data domain=citicigars.com' > "$tmp/domain.json"
          root="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d=d.get("result",d); print((d.get("data") or {}).get("documentroot") or "")' "$tmp/domain.json")"
          [[ "$root" =~ ^/home/bwljrj22/[a-zA-Z0-9_/-]+$ ]]
          real="$(ssh "${auth[@]}" "$remote" "cd '$root' && pwd -P")"
          [[ "$real" == "$root" && "$real" != /home/bwljrj22/citicigars_staging* ]]
          ssh "${auth[@]}" "$remote" "cd '$root' && test -f .htaccess && test ! -L .htaccess && test -r index.html && test -r bundle.js && test -w . && test -w .htaccess && sha256sum index.html bundle.js"
          ssh "${auth[@]}" "$remote" "cd '$root' && cat .htaccess" > "$tmp/routing.original"
          test -s "$tmp/routing.original"
          curl -fsSL --max-time 15 'https://citicigars.com/bundle.js?v=1767441426628' > "$tmp/bundle"
          expected="$(sha256sum "$tmp/bundle" | cut -d ' ' -f1)"
          actual="$(ssh "${auth[@]}" "$remote" "cd '$root' && sha256sum bundle.js" | cut -d ' ' -f1)"
          test "$actual" = "$expected"
          cp "$tmp/routing.original" "$tmp/routing.backup"
          printf 'RewriteEngine On\nRewriteRule ^catalogue/?$ /_vitrine-release/vitrine-test.html [END]\n' > "$tmp/routing.active"
          cat "$tmp/routing.original" >> "$tmp/routing.active"
          mv -- "$tmp/routing.backup" "$tmp/routing.active"
          cmp -s "$tmp/routing.original" "$tmp/routing.active"
          echo "WHC public bundle matches the live HTTP asset. Route backup restored byte for byte on the runner. No remote writes."
