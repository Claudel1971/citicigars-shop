name: WHC Staging - Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        working-directory: CitiCigarsShop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CitiCigarsShop/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          NODE_ENV: production
        run: npx vite build

      - name: Configure DNA runtime for staging only
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail

          EXPECTED_STAGING_API="https://citicigars-api-staging.onrender.com"
          if [ "$VITE_API_URL" != "$EXPECTED_STAGING_API" ]; then
            echo "SECURITY ERROR: VITE_API_URL is not the Render staging backend"
            exit 1
          fi

          cat > dist/public/dna-runtime-config.js <<EOF
          (function configureCitiCigarsDnaRuntime(window) {
            window.CITICIGARS_RUNTIME_CONFIG = {
              ...(window.CITICIGARS_RUNTIME_CONFIG || {}),
              API_BASE: "${VITE_API_URL}/api",
              DNA_PILOT_MODE: true,
            };
          })(window);
          EOF

      - name: Publish clean DNA staging URL
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/public/dna
          cp \
            dist/public/CitiCigars_DNA_Curator_v2_10_3_RC.html \
            dist/public/dna/index.html
          sed -i '/<head>/a\  <base href="/">' dist/public/dna/index.html

      - name: Verify frontend build
        run: |
          set -euo pipefail

          test -f dist/public/index.html
          test -d dist/public/assets
          test -f dist/public/CitiCigars_DNA_Curator_v2_10_3_RC.html
          test -f dist/public/dna/index.html
          grep -Fq '<base href="/">' dist/public/dna/index.html
          cmp -s \
            <(sed '/<base href="\/">/d' dist/public/dna/index.html) \
            dist/public/CitiCigars_DNA_Curator_v2_10_3_RC.html
          grep -Fq 'https://citicigars-api-staging.onrender.com/api' dist/public/dna-runtime-config.js
          grep -Fq 'DNA_PILOT_MODE: true' dist/public/dna-runtime-config.js
          if grep -Fq 'https://citicigars-api.onrender.com' dist/public/dna-runtime-config.js; then
            echo "SECURITY ERROR: production API found in DNA staging runtime"
            exit 1
          fi

          echo "FRONTEND BUILD: OK"
          echo "OUTPUT: dist/public"

      - name: Configure SSH
        working-directory: .
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.WHC_SSH_KEY }}" > ~/.ssh/whc_key
          chmod 600 ~/.ssh/whc_key

          printf '%s\n' "${{ vars.WHC_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend to WHC staging
        working-directory: .
        shell: bash
        env:
          WHC_HOST: ${{ vars.WHC_HOST }}
          WHC_PORT: ${{ vars.WHC_PORT }}
          WHC_USER: ${{ vars.WHC_USER }}
          WHC_STAGING_PATH: ${{ vars.WHC_STAGING_PATH }}
        run: |
          set -euo pipefail

          EXPECTED_PATH="/home/bwljrj22/citicigars_staging"

          if [ "$WHC_STAGING_PATH" != "$EXPECTED_PATH" ]; then
            echo "SECURITY ERROR: unexpected staging path"
            exit 1
          fi

          ssh \
            -p "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$WHC_USER@$WHC_HOST" \
            "test -d '$WHC_STAGING_PATH'"

          rsync -avz \
            -e "ssh -p $WHC_PORT -i ~/.ssh/whc_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            CitiCigarsShop/dist/public/ \
            "$WHC_USER@$WHC_HOST:$WHC_STAGING_PATH/"

          LEGACY_DNA_PATH="$WHC_STAGING_PATH/CitiCigars_DNA_Curator_v2_10_3_RC.html"
          HTACCESS_PATH="$WHC_STAGING_PATH/.htaccess"
          HTACCESS_TEMP_PATH="$WHC_STAGING_PATH/.htaccess.dna-staging.tmp"
          ssh \
            -p "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$WHC_USER@$WHC_HOST" \
            "set -e
             rm -f -- '$LEGACY_DNA_PATH'
             test ! -e '$LEGACY_DNA_PATH'
             if ! grep -Fq 'RewriteRule ^CitiCigars_DNA_Curator_v2_10_3_RC\.html$ - [G,L]' '$HTACCESS_PATH' 2>/dev/null; then
               {
                 printf '%s\n' \
                   '# BEGIN CITICIGARS DNA LEGACY' \
                   'RewriteEngine On' \
                   'RewriteRule ^CitiCigars_DNA_Curator_v2_10_3_RC\.html$ - [G,L]' \
                   '# END CITICIGARS DNA LEGACY' \
                   ''
                 test ! -f '$HTACCESS_PATH' || cat '$HTACCESS_PATH'
               } > '$HTACCESS_TEMP_PATH'
               mv -f -- '$HTACCESS_TEMP_PATH' '$HTACCESS_PATH'
             fi
             grep -Fq 'RewriteRule ^CitiCigars_DNA_Curator_v2_10_3_RC\.html$ - [G,L]' '$HTACCESS_PATH'"

          echo "STAGING DEPLOYMENT: OK"
          echo "LEGACY DNA URL REMOVED: OK"
          echo "PRODUCTION NOT TOUCHED"

      - name: Cleanup SSH key
        if: always()
        working-directory: .
        shell: bash
        run: |
          rm -f ~/.ssh/whc_key
