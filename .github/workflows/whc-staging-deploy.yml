name: WHC Staging - Aperçu vitrine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: citicigars-essai-vitrine

jobs:
  essai:
    if: github.ref == 'refs/heads/codex/vitrine-preprod'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compiler le dossier d’essai
        working-directory: CitiCigarsShop
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          node node_modules/vite/bin/vite.js build --config vitrine-preprod.config.ts
          test -f dist/essai-vitrine/vitrine-test.html
          test -f dist/essai-vitrine/.htaccess
          grep -Fq '/essai-vitrine/assets/' dist/essai-vitrine/vitrine-test.html
          grep -Fq 'https://citicigars-api-staging.onrender.com' dist/essai-vitrine/assets/*.js
          if grep -Fq 'https://citicigars-api.onrender.com' dist/essai-vitrine/assets/*.js; then
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > dist/essai-vitrine/.vitrine-preview

      - name: Transférer le seul sous-dossier de préproduction
        env:
          WHC_HOST: ${{ vars.WHC_HOST }}
          WHC_PORT: ${{ vars.WHC_PORT }}
          WHC_USER: ${{ vars.WHC_USER }}
          WHC_STAGING_PATH: ${{ vars.WHC_STAGING_PATH }}
          WHC_KNOWN_HOSTS: ${{ vars.WHC_KNOWN_HOSTS }}
          WHC_SSH_KEY: ${{ secrets.WHC_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$WHC_STAGING_PATH" = /home/bwljrj22/citicigars_staging
          key="$RUNNER_TEMP/essai-vitrine-key"
          known="$RUNNER_TEMP/essai-vitrine-known-hosts"
          umask 077
          printf '%s\n' "$WHC_SSH_KEY" > "$key"
          printf '%s\n' "$WHC_KNOWN_HOSTS" > "$known"
          trap 'rm -f -- "$key" "$known"' EXIT
          auth=(-p "$WHC_PORT" -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
          remote="$WHC_USER@$WHC_HOST"
          destination="$WHC_STAGING_PATH/essai-vitrine"
          incoming="$(ssh "${auth[@]}" "$remote" "test -d '$WHC_STAGING_PATH' && test ! -L '$WHC_STAGING_PATH' && mktemp -d '$WHC_STAGING_PATH/.essai-vitrine.XXXXXXXX'")"
          [[ "$incoming" == "$WHC_STAGING_PATH"/.essai-vitrine.* && "${incoming#"$WHC_STAGING_PATH"/}" =~ ^\.essai-vitrine\.[A-Za-z0-9]+$ ]]
          rsync -rz --chmod=D755,F644 \
            -e "ssh -p $WHC_PORT -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known" \
            CitiCigarsShop/dist/essai-vitrine/ "$remote:$incoming/"
          ssh "${auth[@]}" "$remote" "set -eu
            test -f '$incoming/.vitrine-preview'
            test -f '$incoming/vitrine-test.html'
            test ! -L '$destination'
            chmod 755 '$incoming'
            if [ -e '$destination' ]; then
              test -f '$destination/.vitrine-preview'
              backup=\$(mktemp -d '$WHC_STAGING_PATH/.essai-vitrine-retour.XXXXXXXX')
              mv -- '$destination' \"\$backup/site\"
              if ! mv -- '$incoming' '$destination'; then
                mv -- \"\$backup/site\" '$destination'
                exit 1
              fi
            else
              mv -- '$incoming' '$destination'
            fi"

      - name: Vérifier la réponse HTTPS
        run: |
          set -euo pipefail
          for path in '' catalogue produit/CTCG-HO-000001 checkout coffrets entreprises evenements; do
            curl -fsSL --max-time 15 "https://staging.citicigars.com/essai-vitrine/$path" > "$RUNNER_TEMP/essai.html"
            grep -Fq '/essai-vitrine/assets/' "$RUNNER_TEMP/essai.html"
          done
