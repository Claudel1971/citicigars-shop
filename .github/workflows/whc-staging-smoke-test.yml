name: WHC Staging - Smoke Test

on:
  workflow_dispatch:
    inputs:
      provision_database:
        description: Create the isolated WHC staging database and user
        required: false
        default: false
        type: boolean
      import_rehearsal:
        description: Import the validated rehearsal without DNA leads or watches
        required: false
        default: false
        type: boolean
      audit_legacy_encoding:
        description: Audit client-visible legacy encoding in the isolated staging DB
        required: false
        default: false
        type: boolean
      repair_legacy_encoding:
        description: Apply only source-proven legacy encoding repairs to staging
        required: false
        default: false
        type: boolean

jobs:
  test-whc-connection:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository for legacy encoding audit
        if: ${{ inputs.audit_legacy_encoding || inputs.repair_legacy_encoding }}
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.WHC_SSH_KEY }}" > ~/.ssh/whc_key
          chmod 600 ~/.ssh/whc_key

          printf '%s\n' "${{ vars.WHC_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test WHC connection and staging path
        shell: bash
        env:
          WHC_HOST: ${{ vars.WHC_HOST }}
          WHC_PORT: ${{ vars.WHC_PORT }}
          WHC_USER: ${{ vars.WHC_USER }}
          WHC_STAGING_PATH: ${{ vars.WHC_STAGING_PATH }}
        run: |
          set -euo pipefail

          EXPECTED_PATH="/home/bwljrj22/citicigars_staging"

          if [ "$WHC_STAGING_PATH" != "$EXPECTED_PATH" ]; then
            echo "SECURITY ERROR: unexpected staging path"
            exit 1
          fi

          ssh \
            -p "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$WHC_USER@$WHC_HOST" \
            "test -d '$WHC_STAGING_PATH' && echo 'SSH CONNECTION: OK' && echo 'STAGING DIRECTORY: OK' && echo 'PRODUCTION NOT TOUCHED' && uapi --output=json Mysql list_databases && uapi --output=json Mysql list_users"

      - name: Provision isolated staging database
        if: ${{ inputs.provision_database }}
        shell: bash
        env:
          WHC_HOST: ${{ vars.WHC_HOST }}
          WHC_PORT: ${{ vars.WHC_PORT }}
          WHC_USER: ${{ vars.WHC_USER }}
          WHC_STAGING_DB_PASSWORD: ${{ secrets.WHC_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail

          DB_NAME="bwljrj22_citicigars_staging"
          DB_USER="bwljrj22_citicigars_stg"
          ESCAPED_PASSWORD=$(printf '%q' "$WHC_STAGING_DB_PASSWORD")

          ssh \
            -p "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$WHC_USER@$WHC_HOST" \
            "uapi --output=json Mysql create_database name='$DB_NAME'; uapi --output=json Mysql create_user name='$DB_USER' password=$ESCAPED_PASSWORD; uapi --output=json Mysql set_privileges_on_database user='$DB_USER' database='$DB_NAME' privileges='ALL PRIVILEGES'; uapi --output=json Mysql list_databases; uapi --output=json Mysql list_users"

      - name: Import validated rehearsal into isolated staging database
        if: ${{ inputs.import_rehearsal }}
        shell: bash
        env:
          WHC_HOST: ${{ vars.WHC_HOST }}
          WHC_PORT: ${{ vars.WHC_PORT }}
          WHC_USER: ${{ vars.WHC_USER }}
          WHC_STAGING_PATH: ${{ vars.WHC_STAGING_PATH }}
          WHC_STAGING_DB_PASSWORD: ${{ secrets.WHC_STAGING_DB_PASSWORD }}
          WHC_STAGING_DUMP_GZIP_BASE64: ${{ secrets.WHC_STAGING_DUMP_GZIP_BASE64 }}
        run: |
          set -euo pipefail

          LOCAL_GZIP="$RUNNER_TEMP/citicigars-staging-rehearsal.sql.gz"
          LOCAL_SQL="$RUNNER_TEMP/citicigars-staging-rehearsal.sql"
          REMOTE_SQL="$WHC_STAGING_PATH/.citicigars-staging-rehearsal-$GITHUB_RUN_ID.sql"
          DB_NAME="bwljrj22_citicigars_staging"
          DB_USER="bwljrj22_citicigars_stg"
          ESCAPED_PASSWORD=$(printf '%q' "$WHC_STAGING_DB_PASSWORD")

          printf '%s' "$WHC_STAGING_DUMP_GZIP_BASE64" | base64 --decode > "$LOCAL_GZIP"
          gzip --test "$LOCAL_GZIP"
          gzip --decompress "$LOCAL_GZIP"

          scp \
            -P "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LOCAL_SQL" \
            "$WHC_USER@$WHC_HOST:$REMOTE_SQL"

          ssh \
            -p "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$WHC_USER@$WHC_HOST" \
            "set -e; MYSQL_PWD=$ESCAPED_PASSWORD mariadb --host=localhost --user='$DB_USER' --database='$DB_NAME' --default-character-set=utf8mb4 --execute=\"source $REMOTE_SQL\"; rm -f '$REMOTE_SQL'; MYSQL_PWD=$ESCAPED_PASSWORD mariadb --host=localhost --user='$DB_USER' --database='$DB_NAME' --batch --skip-column-names --execute=\"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE(); SELECT COUNT(*) FROM products; SELECT COUNT(*) FROM product_images; SELECT COUNT(*) FROM stock_balances; SELECT COUNT(*) FROM stock_movements; SELECT COUNT(*) FROM dna_leads; SELECT COUNT(*) FROM dna_availability_watch;\""

          TRIGGER_COUNT=$(ssh \
            -p "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$WHC_USER@$WHC_HOST" \
            "MYSQL_PWD=$ESCAPED_PASSWORD mariadb --host=localhost --user='$DB_USER' --database='$DB_NAME' --batch --skip-column-names --execute=\"SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema=DATABASE();\"")

          if [ "$TRIGGER_COUNT" != "7" ]; then
            echo "SECURITY ERROR: expected 7 Stock Central triggers, got $TRIGGER_COUNT"
            exit 1
          fi
          echo "STOCK CENTRAL TRIGGERS: 7"

          rm -f "$LOCAL_SQL"

      - name: Audit and repair client-visible legacy encoding
        if: ${{ inputs.audit_legacy_encoding || inputs.repair_legacy_encoding }}
        shell: bash
        env:
          WHC_HOST: ${{ vars.WHC_HOST }}
          WHC_PORT: ${{ vars.WHC_PORT }}
          WHC_USER: ${{ vars.WHC_USER }}
          WHC_STAGING_PATH: ${{ vars.WHC_STAGING_PATH }}
          WHC_STAGING_DB_PASSWORD: ${{ secrets.WHC_STAGING_DB_PASSWORD }}
          APPLY_REPAIR: ${{ inputs.repair_legacy_encoding }}
        run: |
          set -euo pipefail

          EXPECTED_PATH="/home/bwljrj22/citicigars_staging"
          DB_NAME="bwljrj22_citicigars_staging"
          DB_USER="bwljrj22_citicigars_stg"
          ESCAPED_PASSWORD=$(printf '%q' "$WHC_STAGING_DB_PASSWORD")
          LOCAL_AUDIT="$GITHUB_WORKSPACE/CitiCigarsShop/scripts/audit-legacy-client-encoding.sql"
          LOCAL_REPAIR="$RUNNER_TEMP/repair-legacy-client-encoding.sql"

          if [ "$WHC_STAGING_PATH" != "$EXPECTED_PATH" ]; then
            echo "SECURITY ERROR: unexpected staging path"
            exit 1
          fi

          node "$GITHUB_WORKSPACE/CitiCigarsShop/scripts/build-legacy-encoding-repair-sql.mjs" \
            --expected-database="$DB_NAME" > "$LOCAL_REPAIR"

          scp \
            -P "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LOCAL_AUDIT" "$LOCAL_REPAIR" \
            "$WHC_USER@$WHC_HOST:$WHC_STAGING_PATH/"

          ssh \
            -p "$WHC_PORT" \
            -i ~/.ssh/whc_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$WHC_USER@$WHC_HOST" \
            "set -e
             test \"\$(MYSQL_PWD=$ESCAPED_PASSWORD mariadb --host=localhost --user='$DB_USER' --database='$DB_NAME' --batch --skip-column-names --execute='SELECT DATABASE()')\" = '$DB_NAME'
             echo 'LEGACY ENCODING AUDIT: BEFORE'
             MYSQL_PWD=$ESCAPED_PASSWORD mariadb --host=localhost --user='$DB_USER' --database='$DB_NAME' --default-character-set=utf8mb4 --table < '$WHC_STAGING_PATH/audit-legacy-client-encoding.sql'
             if [ '$APPLY_REPAIR' = 'true' ]; then
               MYSQL_PWD=$ESCAPED_PASSWORD mariadb --host=localhost --user='$DB_USER' --database='$DB_NAME' --default-character-set=utf8mb4 < '$WHC_STAGING_PATH/repair-legacy-client-encoding.sql'
               echo 'LEGACY ENCODING REPAIR: APPLIED'
               echo 'LEGACY ENCODING AUDIT: AFTER'
               MYSQL_PWD=$ESCAPED_PASSWORD mariadb --host=localhost --user='$DB_USER' --database='$DB_NAME' --default-character-set=utf8mb4 --table < '$WHC_STAGING_PATH/audit-legacy-client-encoding.sql'
             fi
             rm -f -- '$WHC_STAGING_PATH/audit-legacy-client-encoding.sql' '$WHC_STAGING_PATH/repair-legacy-client-encoding.sql'"

          rm -f "$LOCAL_REPAIR"
          echo "STAGING LEGACY ENCODING AUDIT: COMPLETE"
          echo "PRODUCTION NOT TOUCHED"

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/whc_key
