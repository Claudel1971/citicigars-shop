name: exodia-event-forwarder

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main]
  workflow_run:
    workflows: ["WHC Staging - Deploy Frontend", "WHC Staging - Smoke Test"]
    types: [completed]


permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Forward material GitHub event to Airtable
        env:
          HOOK_URL: ${{ secrets.EXODIA_AIRTABLE_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_KEY: ${{ github.repository }}:${{ github.event_name }}:${{ github.event.action }}:${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}:${{ github.event.pull_request.number }}:${{ github.event.workflow_run.name }}:${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOOK_URL:-}" ]; then
            echo "EXODIA_AIRTABLE_WEBHOOK_URL is not configured; fail closed with no outbound call."
            exit 0
          fi

          payload="$(jq -n \
            --arg event_name "${EVENT_NAME:-}" \
            --arg action "${ACTION:-}" \
            --arg repository "${REPOSITORY:-}" \
            --arg actor "${ACTOR:-}" \
            --arg ref "${REF:-}" \
            --arg head_sha "${HEAD_SHA:-}" \
            --arg pr_number "${PR_NUMBER:-}" \
            --arg pr_url "${PR_URL:-}" \
            --arg pr_head_sha "${PR_HEAD_SHA:-}" \
            --arg workflow_name "${WORKFLOW_NAME:-}" \
            --arg workflow_conclusion "${WORKFLOW_CONCLUSION:-}" \
            --arg workflow_url "${WORKFLOW_URL:-}" \
            --arg workflow_head_sha "${WORKFLOW_HEAD_SHA:-}" \
            --arg event_key "${EVENT_KEY:-}" \
            '{
              event_name: $event_name,
              action: $action,
              repository: $repository,
              actor: $actor,
              ref: $ref,
              head_sha: $head_sha,
              pr_number: $pr_number,
              pr_url: $pr_url,
              pr_head_sha: $pr_head_sha,
              workflow_name: $workflow_name,
              workflow_conclusion: $workflow_conclusion,
              workflow_url: $workflow_url,
              workflow_head_sha: $workflow_head_sha,
              event_key: $event_key
            }')"

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$HOOK_URL"
