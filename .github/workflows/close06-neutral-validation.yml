name: CLOSE-06 Neutral Validation

on:
  push:
    branches:
      - replit-commerce-os-v2
    paths:
      - "CitiCigarsShop/**"
      - ".github/workflows/close06-neutral-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: close06-neutral-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CitiCigarsShop
    env:
      CI: "true"
      CMS_ADMIN_PASSWORD: "ci-only-not-a-secret"
      MYSQL_URL: "mysql://root@127.0.0.1:3399/not_used_by_neutral_ci"

    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CitiCigarsShop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Run full test suite
        run: npx vitest run --config vitest.config.ts --reporter=verbose

      - name: Build
        run: npm run build
