name: CLOSE-06 Neutral Validation

on:
  push:
    branches:
      - replit-commerce-os-v2
    paths:
      - "CitiCigarsShop/**"
      - ".github/workflows/close06-neutral-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: close06-neutral-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: close06-ci
          MYSQL_DATABASE: citicigars_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pclose06-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: CitiCigarsShop

    env:
      CI: "true"
      CMS_ADMIN_PASSWORD: "ci-only-not-a-secret"
      MYSQL_URL: "mysql://root:close06-ci@127.0.0.1:3306/citicigars_ci"

    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CitiCigarsShop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Initialize ephemeral CI schema
        run: npx drizzle-kit push --config drizzle.config.mysql.ts --force

      - name: Run full test suite
        run: npx vitest run --config vitest.config.ts --reporter=verbose

      - name: Build
        run: npm run build
